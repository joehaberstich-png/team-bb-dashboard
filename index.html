<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team BB Working Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { background: #2c3e50; color: white; padding: 20px; border-radius: 10px 10px 0 0; }
        .tabs { display: flex; background: #34495e; }
        .tab { padding: 15px 30px; color: white; cursor: pointer; border: none; background: none; }
        .tab.active { background: #1abc9c; }
        .content { background: white; padding: 30px; border-radius: 0 0 10px 10px; }
        .section { margin-bottom: 30px; }
        .section-title { font-size: 24px; margin-bottom: 20px; color: #2c3e50; }
        .project { background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 8px; padding: 20px; margin-bottom: 15px; }
        .project-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .project-title { font-size: 18px; font-weight: bold; }
        .project-status { padding: 5px 10px; border-radius: 20px; font-size: 12px; }
        .status-draft { background: #ffc107; color: #000; }
        .status-review { background: #17a2b8; color: white; }
        .status-approved { background: #28a745; color: white; }
        .status-published { background: #6c757d; color: white; }
        .progress-bar { height: 10px; background: #e9ecef; border-radius: 5px; margin: 10px 0; overflow: hidden; }
        .progress-fill { height: 100%; background: #1abc9c; border-radius: 5px; }
        .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .btn-primary { background: #007bff; color: white; }
        .btn-success { background: #28a745; color: white; }
        .btn-warning { background: #ffc107; color: #000; }
        .btn-danger { background: #dc3545; color: white; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .modal-content { background: white; margin: 50px auto; padding: 30px; border-radius: 10px; max-width: 800px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-title { font-size: 24px; }
        .close-modal { font-size: 30px; cursor: pointer; }
        .comment-input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; margin: 10px 0; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 8px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .stat-value { font-size: 36px; font-weight: bold; color: #2c3e50; }
        .stat-label { color: #6c757d; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Team BB Working Dashboard</h1>
            <p>Real progress tracking and approval system</p>
        </div>
        
        <div class="tabs">
            <button class="tab active" onclick="switchTab('overview')">Overview</button>
            <button class="tab" onclick="switchTab('projects')">Projects</button>
            <button class="tab" onclick="switchTab('approval')">Approval Queue</button>
            <button class="tab" onclick="switchTab('agents')">Agents</button>
        </div>
        
        <div class="content">
            <div id="overview" class="tab-content">
                <div class="stats">
                    <div class="stat-card">
                        <div class="stat-value" id="total-projects">0</div>
                        <div class="stat-label">Total Projects</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="pending-approval">0</div>
                        <div class="stat-label">Pending Approval</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="completed">0</div>
                        <div class="stat-label">Completed</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="in-progress">0</div>
                        <div class="stat-label">In Progress</div>
                    </div>
                </div>
                
                <div class="section">
                    <h2 class="section-title">Recent Activity</h2>
                    <div id="activity-log"></div>
                </div>
            </div>
            
            <div id="projects" class="tab-content" style="display: none;">
                <div class="section">
                    <h2 class="section-title">All Projects</h2>
                    <div id="projects-list"></div>
                </div>
            </div>
            
            <div id="approval" class="tab-content" style="display: none;">
                <div class="section">
                    <h2 class="section-title">Approval Queue</h2>
                    <div id="approval-queue"></div>
                </div>
            </div>
            
            <div id="agents" class="tab-content" style="display: none;">
                <div class="section">
                    <h2 class="section-title">Agent Team</h2>
                    <div id="agents-list"></div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Review Modal -->
    <div id="review-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Review Project</div>
                <button class="close-modal" onclick="closeModal()">×</button>
            </div>
            <div id="modal-content">
                <!-- Dynamic content -->
            </div>
        </div>
    </div>
    
    <script>
        // Data storage
        let projects = JSON.parse(localStorage.getItem('bb-projects')) || [];
        let activity = JSON.parse(localStorage.getItem('bb-activity')) || [];
        
        // Initialize with sample data if empty
        if (projects.length === 0) {
            projects = [
                {
                    id: 1,
                    title: "Dashboard Development",
                    agent: "Web Developer",
                    status: "approved",
                    progress: 100,
                    description: "Build working dashboard with approval system",
                    content: "Complete dashboard with localStorage persistence, real approval workflow, and progress tracking.",
                    created: new Date().toISOString(),
                    updated: new Date().toISOString()
                },
                {
                    id: 2,
                    title: "Marketing Strategy",
                    agent: "Marketing Boss",
                    status: "review",
                    progress: 90,
                    description: "Promotion plan for new service",
                    content: "Social media campaign, email sequences, partnership outreach.",
                    created: new Date().toISOString(),
                    updated: new Date().toISOString()
                },
                {
                    id: 3,
                    title: "Content Automation",
                    agent: "Content Writer",
                    status: "draft",
                    progress: 60,
                    description: "Automate blog post creation",
                    content: "Set up content generation pipeline with AI assistance.",
                    created: new Date().toISOString(),
                    updated: new Date().toISOString()
                },
                {
                    id: 4,
                    title: "System Integration",
                    agent: "Operations Boss",
                    status: "in-progress",
                    progress: 40,
                    description: "Connect all agent systems",
                    content: "API integrations between marketing, content, and development tools.",
                    created: new Date().toISOString(),
                    updated: new Date().toISOString()
                }
            ];
            saveData();
        }
        
        // Agents
        const agents = [
            { id: 1, name: "Marketing Boss", role: "Marketing", active: true },
            { id: 2, name: "Operations Boss", role: "Operations", active: true },
            { id: 3, name: "Customer Success Boss", role: "Support", active: true },
            { id: 4, name: "Content Writer", role: "Content", active: true },
            { id: 5, name: "Web Developer", role: "Development", active: true },
            { id: 6, name: "Data Analyst", role: "Analytics", active: true },
            { id: 7, name: "Research Scout", role: "Research", active: true },
            { id: 8, name: "Support Agent", role: "Support", active: true },
            { id: 9, name: "Review Manager", role: "Quality", active: true }
        ];
        
        // Save data to localStorage
        function saveData() {
            localStorage.setItem('bb-projects', JSON.stringify(projects));
            localStorage.setItem('bb-activity', JSON.stringify(activity));
            updateStats();
            renderProjects();
            renderApprovalQueue();
            renderActivity();
            renderAgents();
        }
        
        // Add activity log
        function addActivity(message) {
            activity.unshift({
                message: message,
                timestamp: new Date().toISOString(),
                time: new Date().toLocaleTimeString()
            });
            if (activity.length > 50) activity = activity.slice(0, 50);
            saveData();
        }
        
        // Update project
        function updateProject(id, updates) {
            const index = projects.findIndex(p => p.id === id);
            if (index !== -1) {
                projects[index] = { ...projects[index], ...updates, updated: new Date().toISOString() };
                saveData();
                return true;
            }
            return false;
        }
        
        // Tab switching
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
            event.target.classList.add('active');
            document.getElementById(tabName).style.display = 'block';
        }
        
        // Render projects
        function renderProjects() {
            const container = document.getElementById('projects-list');
            if (!container) return;
            
            container.innerHTML = projects.map(project => `
                <div class="project" data-id="${project.id}">
                    <div class="project-header">
                        <div class="project-title">${project.title}</div>
                        <span class="project-status status-${project.status}">${project.status.toUpperCase()}</span>
                    </div>
                    <div>Agent: ${project.agent}</div>
                    <div>${project.description}</div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${project.progress}%"></div>
                    </div>
                    <div>Progress: ${project.progress}%</div>
                    <div style="margin-top: 10px;">
                        ${project.status === 'review' ? 
                            `<button class="btn btn-primary" onclick="reviewProject(${project.id})">Review</button>` : 
                            `<button class="btn btn-primary" onclick="viewProject(${project.id})">View Details</button>`
                        }
                        ${project.status === 'draft' ? `<button class="btn btn-success" onclick="submitForReview(${project.id})">Submit for Review</button>` : ''}
                        ${project.status === 'in-progress' ? `<button class="btn btn-warning" onclick="updateProgress(${project.id})">Update Progress</button>` : ''}
                    </div>
                </div>
            `).join('');
        }
        
        // Render approval queue
        function renderApprovalQueue() {
            const container = document.getElementById('approval-queue');
            if (!container) return;
            
            const reviewProjects = projects.filter(p => p.status === 'review');
            container.innerHTML = reviewProjects.map(project => `
                <div class="project" data-id="${project.id}">
                    <div class="project-header">
                        <div class="project-title">${project.title}</div>
                        <span class="project-status status-review">REVIEW</span>
                    </div>
                    <div>Agent: ${project.agent}</div>
                    <div>${project.description}</div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${project.progress}%"></div>
                    </div>
                    <div style="margin-top: 10px;">
                        <button class="btn btn-success" onclick="approveProject(${project.id})">Approve</button>
                        <button class="btn btn-warning" onclick="requestEdit(${project.id})">Request Edit</button>
                        <button class="btn btn-danger" onclick="rejectProject(${project.id})">Reject</button>
                        <button class="btn btn-primary" onclick="reviewProject(${project.id})">Review Details</button>
                    </div>
                </div>
            `).join('');
        }
        
        // Render activity
        function renderActivity() {
            const container = document.getElementById('activity-log');
            if (!container) return;
            
            container.innerHTML = activity.slice(0, 10).map(item => `
                <div class="project" style="padding: 10px; margin-bottom: 10px;">
                    <div>${item.message}</div>
                    <div style="color: #6c757d; font-size: 12px;">${item.time}</div>
                </div>
            `).join('');
        }
        
        // Render agents
        function renderAgents() {
            const container = document.getElementById('agents-list');
            if (!container) return;
            
            container.innerHTML = agents.map(agent => `
                <div class="project" style="padding: 15px;">
                    <div class="project-header">
                        <div class="project-title">${agent.name}</div>
                        <span style="color: ${agent.active ? '#28a745' : '#dc3545'}">● ${agent.active ? 'Active' : 'Inactive'}</span>
                    </div>
                    <div>Role: ${agent.role}</div>
                    <div>Projects: ${projects.filter(p => p.agent === agent.name).length}</div>
                </div>
            `).join('');
        }
        
        // Update stats
        function updateStats() {
            document.getElementById('total-projects').textContent = projects.length;
            document.getElementById('pending-approval').textContent = projects.filter(p => p.status === 'review').length;
            document.getElementById('completed').textContent = projects.filter(p => p.status === 'approved').length;
            document.getElementById('in-progress').textContent = projects.filter(p => p.status === 'in-progress').length;
        }
        
        // Project actions
        function submitForReview(id) {
            if (updateProject(id, { status: 'review' })) {
                addActivity(`Project "${projects.find(p => p.id === id).title}" submitted for review`);
                alert('Project submitted for review!');
            }
        }
        
        function approveProject(id) {
            const project = projects.find(p => p.id === id);
            if (project && updateProject(id, { status: 'approved', progress: 100 })) {
                addActivity(`Project "${project.title}" approved`);
                alert('Project approved! Marked as completed.');
            }
        }
        
        function requestEdit(id) {
            const comment = prompt('What needs to be edited?');
            if (comment) {
                const project = projects.find(p => p.id === id);
                if (updateProject(id, { status: 'draft' })) {
                    addActivity(`Edit requested for "${project.title}": ${comment}`);
                    alert('Edit requested. Project returned to draft.');
                }
            }
        }
        
        function rejectProject(id) {
            const reason = prompt('Reason for rejection?');
            if (reason) {
                const project = projects.find(p => p.id === id);
                if (updateProject(id, { status: 'draft', progress: 0 })) {
                    addActivity(`Project "${project.title}" rejected: ${reason}`);
                    alert('Project rejected and reset to draft.');
                }
            }
        }
        
        function updateProgress(id) {
            const progress = prompt('Enter new progress (0-100):');
            if (progress !== null && !isNaN(progress)) {
                const num = parseInt(progress);
                if (num >= 0 && num <= 100) {
                    const project = projects.find(p => p.id === id);
                    if (updateProject(id, { progress: num })) {
                        addActivity(`Progress updated for "${project.title}": ${num}%`);
                        alert(`Progress updated to ${num}%`);
                    }
                } else {
                    alert('Please enter a number between 0 and 100');
                }
            }
        }
        
        function reviewProject(id) {
            const project = projects.find(p => p.id === id);
            const modal = document.getElementById('review-modal');
            const content = document.getElementById('modal-content');
            
            content.innerHTML = `
                <h3>${project.title}</h3>
                <p><strong>Agent:</strong> ${project.agent}</p>
                <p><strong>Status:</strong> ${project.status}</p>
                <p><strong>Progress:</strong> ${project.progress}%</p>
                <p><strong>Description:</strong> ${project.description}</p>
                <div style="background: #f8f9fa; padding: 15px; border-radius: 5px; margin: 15px 0;">
                    <strong>Content:</strong><br>${project.content}
                </div>
                <div>
                    <strong>Add Comment:</strong>
                    <textarea class="comment-input" rows="3" placeholder="Your comments..."></textarea>
                </div>
                <div style="margin-top: 20px;">
                    ${project.status === 'review' ? `
                        <button class="btn btn-success" onclick="approveProject(${id}); closeModal()">Approve</button>
                        <button class="btn btn-warning" onclick="requestEdit(${id}); closeModal()">Request Edit</button>
                        <button class="btn btn-danger" onclick="rejectProject(${id}); closeModal()">Reject</button>
                    ` : ''}
                    <button class="btn btn-primary" onclick="closeModal()">Close</button>
                </div>
            `;
            
            modal.style.display = 'block';
        }
        
        function viewProject(id) {
            const project = projects.find(p => p.id === id);
            const modal = document.getElementById('review-modal');
            const content = document.getElementById('modal-content');
            
            content.innerHTML = `
                <h3>${project.title}</h3>
                <p><strong>Agent:</strong> ${project.agent}</p>
                <p><strong>Status:</strong> ${project.status}</p>
                <p><strong>Progress:</strong> ${project.progress}%</p>
                <p><strong>Description:</strong> ${project.description}</p>
                <div style="background: #f8f9fa; padding: 15px; border-radius: 5px; margin: 15px 0;">
                    <strong>Content:</strong><br>${project.content}
                </div>
                <div style="margin-top: 20px;">
                    <button class="btn btn-primary" onclick="closeModal()">Close</button>
                </div>
            `;
            
            modal.style.display = 'block';
        }
        
        function closeModal() {
            document.getElementById('review-modal').style.display = 'none';
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            saveData(); // Initial render
            addActivity('Dashboard loaded');
        });
        
        // Close modal on outside click
        window.onclick = function(event) {
            const modal = document.getElementById('review-modal');
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
