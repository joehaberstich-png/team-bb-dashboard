<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team BB Real Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { background: linear-gradient(135deg, #2c3e50, #1a252f); color: white; padding: 25px; border-radius: 10px 10px 0 0; }
        .tabs { display: flex; background: #34495e; }
        .tab { padding: 15px 30px; color: white; cursor: pointer; border: none; background: none; }
        .tab.active { background: #1abc9c; }
        .content { background: white; padding: 30px; border-radius: 0 0 10px 10px; }
        .section { margin-bottom: 40px; }
        .section-title { font-size: 24px; margin-bottom: 20px; color: #2c3e50; border-bottom: 2px solid #1abc9c; padding-bottom: 10px; }
        .project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 25px; }
        .project-card { background: white; border: 1px solid #e0e0e0; border-radius: 10px; padding: 25px; box-shadow: 0 3px 10px rgba(0,0,0,0.08); transition: transform 0.2s; }
        .project-card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.12); }
        .project-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .project-title { font-size: 20px; font-weight: bold; color: #2c3e50; }
        .project-status { padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .status-draft { background: #ffc107; color: #000; }
        .status-review { background: #17a2b8; color: white; }
        .status-approved { background: #28a745; color: white; }
        .status-published { background: #6c757d; color: white; }
        .status-in-progress { background: #007bff; color: white; }
        .project-meta { color: #666; font-size: 14px; margin-bottom: 15px; }
        .project-description { margin-bottom: 20px; line-height: 1.5; }
        .outputs { background: #f8f9fa; border-radius: 8px; padding: 15px; margin: 15px 0; }
        .output-title { font-weight: bold; margin-bottom: 10px; color: #495057; }
        .file-list { list-style: none; }
        .file-item { padding: 8px 0; border-bottom: 1px solid #e9ecef; }
        .file-item:last-child { border-bottom: none; }
        .file-link { color: #1abc9c; text-decoration: none; }
        .file-link:hover { text-decoration: underline; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
        .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; font-weight: bold; text-decoration: none; display: inline-block; }
        .btn-primary { background: #007bff; color: white; }
        .btn-success { background: #28a745; color: white; }
        .btn-warning { background: #ffc107; color: #000; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-info { background: #17a2b8; color: white; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: white; padding: 25px; border-radius: 10px; text-align: center; box-shadow: 0 3px 10px rgba(0,0,0,0.08); }
        .stat-value { font-size: 42px; font-weight: bold; color: #2c3e50; }
        .stat-label { color: #6c757d; margin-top: 10px; font-size: 14px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; }
        .modal-content { background: white; margin: 50px auto; padding: 40px; border-radius: 15px; max-width: 900px; max-height: 80vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .modal-title { font-size: 28px; color: #2c3e50; }
        .close-modal { font-size: 36px; cursor: pointer; color: #666; }
        .preview-frame { width: 100%; height: 400px; border: 1px solid #ddd; border-radius: 8px; margin: 20px 0; }
        .activity-log { max-height: 400px; overflow-y: auto; }
        .activity-item { padding: 15px; border-bottom: 1px solid #eee; }
        .activity-time { color: #888; font-size: 12px; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Team BB Real Dashboard</h1>
            <p>Actual project outputs with GitHub links and live previews</p>
        </div>
        
        <div class="tabs">
            <button class="tab active" onclick="switchTab('projects')">Projects</button>
            <button class="tab" onclick="switchTab('approval')">Approval Queue</button>
            <button class="tab" onclick="switchTab('outputs')">All Outputs</button>
            <button class="tab" onclick="switchTab('activity')">Activity</button>
        </div>
        
        <div class="content">
            <div id="projects" class="tab-content">
                <div class="stats">
                    <div class="stat-card">
                        <div class="stat-value" id="total-projects">4</div>
                        <div class="stat-label">Active Projects</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="pending-approval">2</div>
                        <div class="stat-label">Pending Approval</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="files-available">12</div>
                        <div class="stat-label">Files Available</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="agents-active">9</div>
                        <div class="stat-label">Agents Active</div>
                    </div>
                </div>
                
                <div class="section">
                    <h2 class="section-title">Active Projects with Real Outputs</h2>
                    <div class="project-grid" id="projects-grid">
                        <!-- Projects will be loaded here -->
                    </div>
                </div>
            </div>
            
            <div id="approval" class="tab-content" style="display: none;">
                <div class="section">
                    <h2 class="section-title">Approval Queue</h2>
                    <div id="approval-queue"></div>
                </div>
            </div>
            
            <div id="outputs" class="tab-content" style="display: none;">
                <div class="section">
                    <h2 class="section-title">All Project Outputs</h2>
                    <div id="all-outputs"></div>
                </div>
            </div>
            
            <div id="activity" class="tab-content" style="display: none;">
                <div class="section">
                    <h2 class="section-title">Recent Activity</h2>
                    <div class="activity-log" id="activity-log"></div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Preview Modal -->
    <div id="preview-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="preview-title">Project Preview</div>
                <button class="close-modal" onclick="closeModal()">×</button>
            </div>
            <div id="preview-content">
                <!-- Dynamic content -->
            </div>
        </div>
    </div>
    
    <script>
        // Real project data with actual outputs
        const projects = [
            {
                id: 1,
                title: "TheDealWizard.com Promotion Strategy",
                agent: "Marketing Boss",
                status: "review",
                progress: 90,
                description: "$500 Amazon gift card contest promotion strategy",
                outputs: [
                    { 
                        name: "Full Strategy Document", 
                        type: "markdown",
                        url: "https://raw.githubusercontent.com/joehaberstich-png/agent-dashboard/main/TheDealWizard_Promotion_Strategy.md",
                        preview: "Complete low-cost promotion plan with Reddit, Facebook, and partnership strategies"
                    },
                    {
                        name: "Optimization Plan",
                        type: "markdown", 
                        url: "https://raw.githubusercontent.com/joehaberstich-png/agent-dashboard/main/dealwizard_optimization_plan.md",
                        preview: "Entry mechanism enhancements and virality features"
                    }
                ],
                githubUrl: "https://github.com/joehaberstich-png/agent-dashboard/blob/main/TheDealWizard_Promotion_Strategy.md",
                lastUpdated: "2026-04-21",
                needsApproval: true
            },
            {
                id: 2,
                title: "Small Business Financing Email Strategy",
                agent: "Marketing Boss",
                status: "review",
                progress: 85,
                description: "Cold email templates and sequences for small business financing",
                outputs: [
                    {
                        name: "Email Strategy Document",
                        type: "markdown",
                        url: "https://raw.githubusercontent.com/joehaberstich-png/agent-dashboard/main/Small_Business_Financing_Emails.md",
                        preview: "Complete email templates with CAN-SPAM/GDPR compliance"
                    }
                ],
                githubUrl: "https://github.com/joehaberstich-png/agent-dashboard/blob/main/Small_Business_Financing_Emails.md",
                lastUpdated: "2026-04-21",
                needsApproval: true
            },
            {
                id: 3,
                title: "DrugDoctors.com Website Development",
                agent: "Web Developer",
                status: "in-progress",
                progress: 40,
                description: "Website development following FlyToAustralia.com framework",
                outputs: [
                    {
                        name: "Development Framework",
                        type: "html",
                        url: "https://raw.githubusercontent.com/joehaberstich-png/agent-dashboard/main/cracksup.com/index.html",
                        preview: "HTML/CSS framework structure"
                    },
                    {
                        name: "Site Preview",
                        type: "preview",
                        url: "https://joehaberstich-png.github.io/agent-dashboard/cracksup.com/index.html",
                        preview: "Live site preview (example framework)"
                    }
                ],
                githubUrl: "https://github.com/joehaberstich-png/agent-dashboard/tree/main/cracksup.com",
                lastUpdated: "2026-04-22",
                needsApproval: false
            },
            {
                id: 4,
                title: "AllAboutMD.com Content Automation",
                agent: "Operations Boss",
                status: "in-progress",
                progress: 35,
                description: "RSS integration and social media automation system",
                outputs: [
                    {
                        name: "Automation System Design",
                        type: "markdown",
                        url: "https://raw.githubusercontent.com/joehaberstich-png/agent-dashboard/main/AllAboutMD_Automation_System.md",
                        preview: "Complete system design with RSS integration and social automation"
                    }
                ],
                githubUrl: "https://github.com/joehaberstich-png/agent-dashboard/blob/main/AllAboutMD_Automation_System.md",
                lastUpdated: "2026-04-21",
                needsApproval: false
            },
            {
                id: 5,
                title: "Agent Monitoring Dashboard",
                agent: "Web Developer",
                status: "published",
                progress: 100,
                description: "Real dashboard for tracking agent work and approvals",
                outputs: [
                    {
                        name: "Dashboard Live Version",
                        type: "preview",
                        url: "https://joehaberstich-png.github.io/team-bb-dashboard/",
                        preview: "Working dashboard with localStorage persistence"
                    },
                    {
                        name: "Dashboard Source Code",
                        type: "html",
                        url: "https://raw.githubusercontent.com/joehaberstich-png/team-bb-dashboard/main/index.html",
                        preview: "Complete HTML/CSS/JavaScript source"
                    }
                ],
                githubUrl: "https://github.com/joehaberstich-png/team-bb-dashboard",
                lastUpdated: "2026-04-22",
                needsApproval: false
            }
        ];
        
        // Activity log
        let activity = JSON.parse(localStorage.getItem('bb-activity')) || [];
        
        // Initialize activity
        if (activity.length === 0) {
            activity = [
                { message: "Dashboard initialized with real project outputs", time: new Date().toLocaleTimeString() },
                { message: "TheDealWizard.com strategy document available for review", time: new Date().toLocaleTimeString() },
                { message: "Small business financing emails ready for approval", time: new Date().toLocaleTimeString() },
                { message: "DrugDoctors.com framework deployed to GitHub", time: new Date().toLocaleTimeString() }
            ];
            localStorage.setItem('bb-activity', JSON.stringify(activity));
        }
        
        // Tab switching
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
            event.target.classList.add('active');
            document.getElementById(tabName).style.display = 'block';
            
            if (tabName === 'projects') renderProjects();
            if (tabName === 'approval') renderApprovalQueue();
            if (tabName === 'outputs') renderAllOutputs();
            if (tabName === 'activity') renderActivity();
        }
        
        // Render projects
        function renderProjects() {
            const container = document.getElementById('projects-grid');
            if (!container) return;
            
            container.innerHTML = projects.map(project => `
                <div class="project-card">
                    <div class="project-header">
                        <div class="project-title">${project.title}</div>
                        <span class="project-status status-${project.status}">${project.status.toUpperCase().replace('-', ' ')}</span>
                    </div>
                    <div class="project-meta">
                        <strong>Agent:</strong> ${project.agent} | 
                        <strong>Progress:</strong> ${project.progress}% |
                        <strong>Updated:</strong> ${project.lastUpdated}
                    </div>
                    <div class="project-description">${project.description}</div>
                    
                    <div class="outputs">
                        <div class="output-title">📁 Available Outputs:</div>
                        <ul class="file-list">
                            ${project.outputs.map(output => `
                                <li class="file-item">
                                    <a href="${output.url}" target="_blank" class="file-link">${output.name}</a>
                                    <div style="font-size: 12px; color: #666; margin-top: 3px;">${output.preview}</div>
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                    
                    <div class="btn-group">
                        ${project.outputs.map((output, index) => `
                            <button class="btn btn-info" onclick="previewOutput(${project.id}, ${index})">
                                Preview ${output.type === 'preview' ? 'Live' : 'File'}
                            </button>
                        `).join('')}
                        
                        ${project.needsApproval ? `
                            <button class="btn btn-success" onclick="approveProject(${project.id})">Approve</button>
                            <button class="btn btn-warning" onclick="requestChanges(${project.id})">Request Changes</button>
                            <button class="btn btn-primary" onclick="viewDetails(${project.id})">Full Review</button>
                        ` : `
                            <button class="btn btn-primary" onclick="viewDetails(${project.id})">View Details</button>
                        `}
                        
                        <a href="${project.githubUrl}" target="_blank" class="btn" style="background: #24292e; color: white;">
                            <svg style="width: 16px; height: 16px; vertical-align: middle; margin-right: 5px;" viewBox="0 0 16 16" fill="currentColor">
                                <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
                            </svg>
                            GitHub
                        </a>
                    </div>
                </div>
            `).join('');
        }
        
        // Render approval queue
        function renderApprovalQueue() {
            const container = document.getElementById('approval-queue');
            if (!container) return;
            
            const reviewProjects = projects.filter(p => p.needsApproval);
            container.innerHTML = reviewProjects.map(project => `
                <div class="project-card">
                    <div class="project-header">
                        <div class="project-title">${project.title}</div>
                        <span class="project-status status-review">AWAITING APPROVAL</span>
                    </div>
                    <div class="project-meta">
                        <strong>Agent:</strong> ${project.agent} | 
                        <strong>Progress:</strong> ${project.progress}%
                    </div>
                    
                    <div class="outputs">
                        <div class="output-title">📄 Outputs to Review:</div>
                        <ul class="file-list">
                            ${project.outputs.map(output => `
                                <li class="file-item">
                                    <a href="${output.url}" target="_blank" class="file-link">${output.name}</a>
                                    <button class="btn" style="padding: 3px 8px; font-size: 12px; margin-left: 10px;" onclick="previewOutput(${project.id}, ${project.outputs.indexOf(output)})">
                                        Preview
                                    </button>
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                    
                    <div class="btn-group">
                        <button class="btn btn-success" onclick="approveProject(${project.id})">✅ Approve Project</button>
                        <button class="btn btn-warning" onclick="requestChanges(${project.id})">✏️ Request Changes</button>
                        <button class="btn btn-danger" onclick="rejectProject(${project.id})">❌ Reject</button>
                        <button class="btn btn-primary" onclick="viewDetails(${project.id})">📋 Full Review</button>
                    </div>
                </div>
            `).join('');
        }
        
        // Render all outputs
        function renderAllOutputs() {
            const container = document.getElementById('all-outputs');
            if (!container) return;
            
            let allOutputs = [];
            projects.forEach(project => {
                project.outputs.forEach(output => {
                    allOutputs.push({
                        project: project.title,
                        agent: project.agent,
                        ...output
                    });
                });
            });
            
            container.innerHTML = `
                <div class="project-grid">
                    ${allOutputs.map(output => `
                        <div class="project-card">
                            <div class="project-header">
                                <div class="project-title">${output.name}</div>
                                <span style="font-size: 12px; color: #666;">${output.type.toUpperCase()}</span>
                            </div>
                            <div class="project-meta">
                                <strong>Project:</strong> ${output.project} | 
                                <strong>Agent:</strong> ${output.agent}
                            </div>
                            <div style="margin: 15px 0;">${output.preview}</div>
                            <div class="btn-group">
                                <a href="${output.url}" target="_blank" class="btn btn-primary">Open ${output.type === 'preview' ? 'Live' : 'File'}</a>
                                <button class="btn btn-info" onclick="previewOutputByUrl('${output.url}', '${output.name}', '${output.type}')">Preview</button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }
        
        // Render activity
        function renderActivity() {
            const container = document.getElementById('activity-log');
            if (!container) return;
            
            container.innerHTML = activity.map(item => `
                <div class="activity-item">
                    <div>${item.message}</div>
                    <div class="activity-time">${item.time}</div>
                </div>
            `).join('');
        }
        
        // Preview output
        function previewOutput(projectId, outputIndex) {
            const project = projects.find(p => p.id === projectId);
            const output = project.outputs[outputIndex];
            previewOutputByUrl(output.url, output.name, output.type);
        }
        
        function previewOutputByUrl(url, title, type) {
            const modal = document.getElementById('preview-modal');
            const content = document.getElementById('preview-content');
            const modalTitle = document.getElementById('preview-title');
            
            modalTitle.textContent = `Preview: ${title}`;
            
            if (type === 'preview') {
                content.innerHTML = `
                    <h3>Live Preview: ${title}</h3>
                    <p>Opening live preview in new tab...</p>
                    <iframe class="preview-frame" src="${url}"></iframe>
                    <div style="margin-top: 20px;">
                        <a href="${url}" target="_blank" class="btn btn-primary">Open in New Tab</a>
                        <button class="btn" onclick="closeModal()">Close</button>
                    </div>
                `;
            } else {
                content.innerHTML = `
                    <h3>File Preview: ${title}</h3>
                    <p>Loading file content...</p>
                    <div style="background: #f8f9fa; padding: 20px; border-radius: 8px; margin: 20px 0; max-height: 400px; overflow-y: auto;">
                        <pre id="file-content">Loading...</pre>
                    </div>
                    <div>
                        <a href="${url}" target="_blank" class="btn btn-primary">Open Full File</a>
                        <button class="btn" onclick="closeModal()">Close</button>
                    </div>
                `;
                
                // Fetch file content
                fetch(url)
                    .then(response => response.text())
                    .then(text => {
                        document.getElementById('file-content').textContent = text.substring(0, 5000) + (text.length > 5000 ? '\n\n... (truncated)' : '');
                    })
                    .catch(err => {
                        document.getElementById('file-content').textContent = 'Error loading file: ' + err.message;
                    });
            }
            
            modal.style.display = 'block';
        }
        
        // Project actions
        function approveProject(id) {
            const project = projects.find(p => p.id === id);
            project.status = 'approved';
            project.needsApproval = false;
            addActivity(`✅ Project approved: "${project.title}"`);
            alert(`Project "${project.title}" has been approved!`);
            renderProjects();
            renderApprovalQueue();
        }
        
        function requestChanges(id) {
            const project = projects.find(p => p.id === id);
            const changes = prompt(`What changes are needed for "${project.title}"?`);
            if (changes) {
                project.status = 'draft';
                addActivity(`✏️ Changes requested for "${project.title}": ${changes}`);
                alert(`Changes requested. Project returned to draft status.`);
                renderProjects();
                renderApprovalQueue();
            }
        }
        
        function rejectProject(id) {
            const project = projects.find(p => p.id === id);
            const reason = prompt(`Reason for rejecting "${project.title}"?`);
            if (reason) {
                project.status = 'draft';
                project.progress = 0;
                addActivity(`❌ Project rejected: "${project.title}" - ${reason}`);
                alert(`Project rejected and reset to draft.`);
                renderProjects();
                renderApprovalQueue();
            }
        }
        
        function viewDetails(id) {
            const project = projects.find(p => p.id === id);
            const modal = document.getElementById('preview-modal');
            const content = document.getElementById('preview-content');
            const modalTitle = document.getElementById('preview-title');
            
            modalTitle.textContent = `Project Details: ${project.title}`;
            
            content.innerHTML = `
                <h3>${project.title}</h3>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 20px 0;">
                    <div>
                        <strong>Agent:</strong> ${project.agent}<br>
                        <strong>Status:</strong> ${project.status}<br>
                        <strong>Progress:</strong> ${project.progress}%<br>
                        <strong>Last Updated:</strong> ${project.lastUpdated}
                    </div>
                    <div>
                        <strong>Description:</strong><br>
                        ${project.description}
                    </div>
                </div>
                
                <h4>Outputs:</h4>
                <ul>
                    ${project.outputs.map(output => `
                        <li>
                            <strong>${output.name}</strong> (${output.type})<br>
                            <a href="${output.url}" target="_blank">${output.url}</a><br>
                            <em>${output.preview}</em>
                        </li>
                    `).join('')}
                </ul>
                
                <div style="margin-top: 30px;">
                    ${project.needsApproval ? `
                        <button class="btn btn-success" onclick="approveProject(${id}); closeModal()">Approve</button>
                        <button class="btn btn-warning" onclick="requestChanges(${id}); closeModal()">Request Changes</button>
                        <button class="btn btn-danger" onclick="rejectProject(${id}); closeModal()">Reject</button>
                    ` : ''}
                    <button class="btn btn-primary" onclick="closeModal()">Close</button>
                </div>
            `;
            
            modal.style.display = 'block';
        }
        
        // Add activity
        function addActivity(message) {
            activity.unshift({
                message: message,
                time: new Date().toLocaleTimeString()
            });
            if (activity.length > 20) activity = activity.slice(0, 20);
            localStorage.setItem('bb-activity', JSON.stringify(activity));
            renderActivity();
        }
        
        function closeModal() {
            document.getElementById('preview-modal').style.display = 'none';
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            renderProjects();
            renderActivity();
            addActivity('Dashboard loaded with real project outputs');
        });
        
        // Close modal on outside click
        window.onclick = function(event) {
            const modal = document.getElementById('preview-modal');
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
